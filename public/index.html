<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IT Landscape</title>

  <style>
    html, body { width:100%; height:100%; margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #cy { width:100%; height:100%; background:#ffffff; }

    /* Popover (база сразу больше ~в 3 раза) */
    #popover {
      position: fixed;
      right: 16px;
      top: 16px;
      width: 720px;            /* было ~420 */
      max-height: 85vh;
      overflow: auto;
      background: #fff;
      color: #111;
      border: 1px solid #d0d0d0;
      border-radius: 14px;
      padding: 16px;
      display: none;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      z-index: 9999;

      transform-origin: top right;
      transform: scale(calc(var(--uiScale, 1) * 0.5));
    }


    #popover h3 { margin: 0; font-size: 22px; }
    #popover .meta { opacity: .7; font-size: 14px; margin-top: 4px; }
    #popover table { width:100%; border-collapse: collapse; font-size: 16px; margin-top: 10px; }
    #popover td { padding: 10px 10px; border-top: 1px solid #eee; vertical-align: top; }
    #popover td.key { width: 35%; color:#0b5bd3; font-weight: 600; }
    #popover .close {
      position: sticky;
      top: 0;
      float: right;
      cursor: pointer;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 14px;
    }
    #popover .close:hover { background:#efefef; }
  </style>

  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
</head>

<body>
  <div id="cy"></div>

  <div id="popover">
    <button class="close" id="popClose">✕</button>
    <div id="popContent"></div>
  </div>

  <script>
    const pop = document.getElementById('popover');
    const popContent = document.getElementById('popContent');
    document.getElementById('popClose').addEventListener('click', () => pop.style.display = 'none');

    function setUiScale(scale) {
      // scale для popover — через CSS переменную
      pop.style.setProperty('--uiScale', String(scale));
    }

    function safeArr(v) { return Array.isArray(v) ? v : []; }

    function renderPopoverForNode(node) {
      const d = node.data();
      const title = d.label || d.id;
      const attrs = safeArr(d.dataAttributes);

      let rows = '';
      for (const a of attrs) {
        rows += `<tr><td class="key">Attribute</td><td>${escapeHtml(String(a))}</td></tr>`;
      }

      popContent.innerHTML = `
        <h3>${escapeHtml(title)}</h3>
        <div class="meta">Тип: System</div>
        <table>
          ${attrs.length ? rows : `<tr><td class="key">Attribute</td><td><i>нет</i></td></tr>`}
        </table>
      `;
      pop.style.display = 'block';
    }

    function renderPopoverForEdge(edge) {
      const d = edge.data();
      const title = d.label || d.kind || 'Edge';
      const maps = safeArr(d.mappings);

      let rows = '';
      for (const m of maps) {
        rows += `<tr><td class="key">Mapping</td><td>${escapeHtml(String(m))}</td></tr>`;
      }

      popContent.innerHTML = `
        <h3>${escapeHtml(title)}</h3>
        <div class="meta">${escapeHtml(d.source || '')} → ${escapeHtml(d.target || '')}</div>
        <table>
          ${maps.length ? rows : `<tr><td class="key">Mapping</td><td><i>нет</i></td></tr>`}
        </table>
      `;
      pop.style.display = 'block';
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    async function loadGraph() {
      const res = await fetch('/api/graph', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    (async () => {
      let graph;
      try {
        graph = await loadGraph();
      } catch (e) {
        document.body.innerHTML = `<pre style="padding:16px;color:#b00">Не удалось загрузить /api/graph: ${String(e)}</pre>`;
        return;
      }

      // Подготовим элементы: считаем длину label, чтобы под неё масштабировать круг/шрифт
      for (const el of graph.elements || []) {
        if (el.data && el.data.kind === 'system') {
          const label = String(el.data.label || el.data.id || '');
          el.data.labelLen = label.length;
        }
      }

      const cy = cytoscape({
        container: document.getElementById('cy'),
        elements: graph.elements || [],
        style: [
          { selector: 'core', style: { 'background-color': '#ffffff' } },

          // SYSTEM nodes: круг, размер зависит от длины текста
          {
            selector: 'node[kind="system"]',
            style: {
              'shape': 'ellipse',
              'background-color': '#2f80ed',
              'border-color': '#1f5fb3',
              'border-width': 2,

              'label': 'data(label)',
              'text-valign': 'center',
              'text-halign': 'center',
              'color': '#0b0b0b',          // без белых контуров
              'font-weight': 700,
              'text-wrap': 'wrap',
              'text-max-width': '90px',

              // круг растёт под длину
              'width':  'mapData(labelLen, 3, 20, 54, 130)',
              'height': 'mapData(labelLen, 3, 20, 54, 130)',

              // шрифт уменьшается под длину
              'font-size': 'mapData(labelLen, 3, 20, 18, 10)',

              'overlay-opacity': 0
            }
          },

          // DATA_FLOW edges
          {
            selector: 'edge[kind="flow"]',
            style: {
              'line-color': '#1f5fb3',
              'target-arrow-color': '#1f5fb3',
              'target-arrow-shape': 'triangle',
              'arrow-scale': 1.2,
              'curve-style': 'bezier',
              'width': 3,

              'label': 'data(label)',
              'font-size': 12,
              'color': '#1f5fb3',
              'text-background-color': '#ffffff',
              'text-background-opacity': 1,
              'text-background-padding': '2px',
              'text-rotation': 'autorotate'
            }
          }
        ],
        layout: {
          name: 'dagre',
          rankDir: 'LR',
          nodeSep: 70,
          rankSep: 120,
          padding: 40
        }
      });

      // Popover scale зависит от zoom графа:
      function updatePopoverScale() {
        const z = cy.zoom();
        // если граф отдалён (z<1) — popover увеличиваем, но с ограничениями
        const scale = Math.min(2.8, Math.max(1.0, 1.0 / z));
        setUiScale(scale);
      }
      updatePopoverScale();
      cy.on('zoom', updatePopoverScale);

      let lastHoverId = null;

      // Hover по узлу: показать атрибуты
      cy.on('mouseover', 'node[kind="system"]', (evt) => {
        const n = evt.target;
        lastHoverId = n.id();
        renderPopoverForNode(n);
      });

      cy.on('mouseout', 'node[kind="system"]', (evt) => {
        // чтобы popover не мигал при микродвижениях:
        // закрываем, только если ушли с того же узла
        if (lastHoverId === evt.target.id()) {
          // небольшая задержка — если человек сразу идёт к popover
          setTimeout(() => {
            // если мышь сейчас над popover — не закрываем
            const overPop = pop.matches(':hover');
            if (!overPop) pop.style.display = 'none';
          }, 120);
        }
      });

      // Hover по ребру: показать mappings
      cy.on('mouseover', 'edge[kind="flow"]', (evt) => {
        renderPopoverForEdge(evt.target);
      });

      cy.on('mouseout', 'edge[kind="flow"]', () => {
        setTimeout(() => {
          const overPop = pop.matches(':hover');
          if (!overPop) pop.style.display = 'none';
        }, 120);
      });

      // Клик по фону — закрыть popover
      cy.on('tap', (evt) => {
        if (evt.target === cy) pop.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
